name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.316

      - name: Restore
        run: dotnet restore CodexQuotaHud.sln

      - name: Test
        shell: powershell
        run: dotnet test CodexQuotaHud.sln -c Release --no-restore

      - name: Build
        run: dotnet build CodexQuotaHud.sln -c Release --no-restore

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build ephemeral CI candidates
        shell: powershell
        run: .\scripts\package-release.ps1 -Version 0.0.0

      - name: Smoke-test isolated installer
        shell: powershell
        run: .\scripts\test-installer.ps1 -Version 0.0.0 -InstallerPath .\artifacts\release\CodexQuotaHud-Setup-v0.0.0.exe
